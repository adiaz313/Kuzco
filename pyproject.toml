[project]
name = "kuzco-local"
version = "1.0.0rc1"
description = "Local macOS personal assistant release candidate"
requires-python = "==3.14.*"
dependencies = [
  "sounddevice==0.5.6", "cmake==4.4.3", "sherpa-onnx==1.13.7",
  "numpy==2.3.3", "ddgs==9.16.0", "trafilatura==2.2.0",
  "piper-tts==1.8.0", "pathvalidate==3.3.1", "defusedxml==0.7.1",
  "keyring==25.7.0",
]

[dependency-groups]
security = ["pip-audit==2.10.1", "bandit==1.9.4"]
release-test = ["jinja2==3.1.6"]

[tool.uv]
package = false
required-version = "==0.12.11"
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
constraint-dependencies = ["regex==2026.9.3"]
